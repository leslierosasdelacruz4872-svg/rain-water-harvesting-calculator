<script>
    // Datos preconfigurados (Promedio región Bajío últimos 4 años)
    const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    const diasMes = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    // Precipitación promedio mensual en mm (litros/m2)
    const precipitacion = [12, 8, 10, 18, 45, 125, 142, 135, 105, 42, 15, 11];

    function calcularBalance() {
        // Obtener valores de los inputs
        const area = parseFloat(document.getElementById('area').value);
        const ce = parseFloat(document.getElementById('ce').value);
        const personas = parseInt(document.getElementById('personas').value);
        const costoAgua = parseFloat(document.getElementById('costoAgua').value);

        if (isNaN(area) || isNaN(ce) || isNaN(personas) || isNaN(costoAgua)) {
            alert("Por favor, llena todos los campos con números válidos.");
            return;
        }

        const tbody = document.querySelector('#tablaResultados tbody');
        tbody.innerHTML = ''; // Limpiar tabla anterior

        let maxPotcall = 0;

        for (let i = 0; i < 12; i++) {
            // Potcall: (Área × CE × Precipitación) ÷ 1000
            let potcall = (area * ce * precipitacion[i]) / 1000;
            
            // Buscamos el mes de mayor captación para el tamaño de la cisterna
            if(potcall > maxPotcall) maxPotcall = potcall;

            // Ach: (personas × 180 dotación × dias) ÷ 1000
            let ach = (personas * 180 * diasMes[i]) / 1000;

            // Balance: Ach - Potcall
            // Si el balance es positivo, falta agua. Si es negativo, sobra agua pluvial.
            let balance = ach - potcall;

            // Costo: Solo se paga el agua que falta (cuando balance es mayor a 0)
            let aguaFaltante = balance > 0 ? balance : 0;
            let costo = aguaFaltante * costoAgua;

            // Formato visual para el balance (Verde si sobra lluvia, Rojo si falta)
            let balanceClase = balance <= 0 ? 'positive' : 'negative';

            // Insertar fila en la tabla
            tbody.innerHTML += `
                <tr>
                    <td><strong>${meses[i]}</strong></td>
                    <td>${precipitacion[i]}</td>
                    <td>${potcall.toFixed(2)}</td>
                    <td>${ach.toFixed(2)}</td>
                    <td class="${balanceClase}">${balance.toFixed(2)}</td>
                    <td>$${costo.toFixed(2)}</td>
                </tr>
            `;
        }

        // Mostrar sección de resultados
        document.getElementById('resultados').style.display = 'block';
        
        // El volumen de almacenamiento se recomienda en base a la capacidad del mes con más lluvias 
        // para asegurar que no haya desbordamiento.
        document.getElementById('volumenRecomendado').innerText = maxPotcall.toFixed(2) + " m³ (Litros: " + (maxPotcall * 1000).toFixed(0) + ")";
    }
</script>
